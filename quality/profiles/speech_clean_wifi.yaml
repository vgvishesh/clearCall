# Audio package A: good_wifi link with the CLEAN speech corpus — PESQ-WB here is transport/codec fidelity
# (no noise for the suppressor to remove), DNSMOS SIG shows what NS/AGC/Opus do to clean speech.
link: { up_kbps: 20000, down_kbps: 50000, delay_ms: 10, jitter_ms: 2, loss_pct: 0 }
topology: p2p
duration_s: 60
corpus: [speech_clean, talking_head]
mode: voice
seed: 1
